<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Live Timestamp Terminal — JST固定・PC向けオフラインタイムスタンプコピー">
    <title>LIVE TIMESTAMP TERMINAL</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --success-color: #4ade80;
            --danger-color: #f87171;
            --font-mono: "Cascadia Code", "Consolas", "Courier New", monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.08), transparent 42%), var(--bg-color);
            color: var(--text-main);
            font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 32px 24px 40px;
        }
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 28px 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }
        .header h1 {
            font-family: var(--font-mono);
            font-size: 13px;
            letter-spacing: 0.16em;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .header .status {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--success-color);
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .clock-display { text-align: left; margin-bottom: 24px; }
        .day-name { font-size: 15px; color: var(--accent-color); font-weight: 600; margin-bottom: 4px; }
        .date-str { font-family: var(--font-mono); font-size: 22px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 8px; }
        .time-str {
            font-family: var(--font-mono);
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.04em;
            line-height: 1.1;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }
        .timezone-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 12px;
            background: rgba(15, 23, 42, 0.7);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 9999px;
            border: 1px solid var(--card-border);
        }
        .controls { margin-bottom: 20px; }
        .format-select-group { margin-bottom: 12px; }
        .format-select-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            font-family: var(--font-mono);
        }
        select:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }
        .preview-row {
            margin: 10px 0 16px;
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent-color);
            word-break: break-word;
            min-height: 1.5em;
        }
        .btn-copy {
            width: 100%;
            padding: 12px 16px;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-copy:hover { background: var(--accent-hover); color: #ffffff; }
        .btn-copy:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
        .btn-copy.success { background: var(--success-color); color: #052e16; }
        kbd {
            font-family: var(--font-mono);
            font-size: 11px;
            border: 1px solid rgba(15, 23, 42, 0.35);
            border-bottom-width: 2px;
            border-radius: 4px;
            padding: 1px 5px;
            background: rgba(255, 255, 255, 0.35);
        }
        .captured-section {
            background: rgba(15, 23, 42, 0.65);
            border: 1px dashed var(--card-border);
            border-radius: 6px;
            padding: 14px 16px;
        }
        .captured-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .status-toast { font-size: 11px; color: var(--success-color); font-weight: 700; opacity: 0; transition: opacity 0.2s ease; }
        .status-toast.show { opacity: 1; }
        .captured-value {
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--success-color);
            word-break: break-word;
            line-height: 1.5;
            min-height: 1.5em;
            margin-bottom: 10px;
            user-select: text;
        }
        .captured-actions { display: none; gap: 8px; justify-content: flex-end; }
        .captured-actions.is-visible { display: flex; }
        .btn-sub {
            background: rgba(51, 65, 85, 0.7);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .btn-sub:hover { background: rgba(51, 65, 85, 1); }
        .btn-sub.danger:hover { background: rgba(239, 68, 68, 0.18); color: var(--danger-color); border-color: rgba(239, 68, 68, 0.4); }
        .footer {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: #64748b;
        }
        .offline-indicator { display: inline-flex; align-items: center; gap: 6px; }
        .offline-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success-color);
            box-shadow: 0 0 7px rgba(74, 222, 128, 0.6);
        }
        #fallback-textarea { position: fixed; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>LIVE TIMESTAMP TERMINAL</h1>
        <div class="status">REAL-TIME · JST STRICT · PC</div>
    </div>
    <div class="clock-display">
        <div class="day-name" id="display-day">---</div>
        <div class="date-str" id="display-date">---</div>
        <div class="time-str" id="display-time">00:00:00</div>
        <div class="timezone-badge">Asia/Tokyo · JST · UTC+09:00</div>
    </div>
    <div class="controls">
        <div class="format-select-group">
            <label for="format-select">Timestamp Format（ラベルは固定。プレビューのみ毎秒更新）</label>
            <select id="format-select">
                <option value="custom24">24h — DD-Mon-YYYY — HH:MM:SS (JST, UTC+09:00)</option>
                <option value="custom">12h — DD-Mon-YYYY — hh:MM:SS AM/PM (JST, UTC+09:00)</option>
                <option value="long">Long — D Month YYYY — hh:MM:SS AM/PM JST</option>
                <option value="us">US — Month D, YYYY — hh:MM:SS AM/PM (JST)</option>
                <option value="iso">ISO 8601 — YYYY-MM-DDTHH:MM:SS+09:00</option>
                <option value="datetime">DateTime — YYYY-MM-DD HH:MM:SS JST</option>
                <option value="japanese">Japanese — YYYY年MM月DD日(曜) HH時MM分SS秒</option>
                <option value="unix">Unix — epoch seconds (UTC absolute)</option>
            </select>
        </div>
        <div class="preview-row" id="live-preview">---</div>
        <button class="btn-copy" id="copy-btn" type="button"><span>今の時刻をコピー</span><kbd>C</kbd></button>
    </div>
    <div class="captured-section">
        <div class="captured-title">
            <span>LAST CAPTURED</span>
            <span class="status-toast" id="status-toast">COPIED</span>
        </div>
        <div class="captured-value" id="captured-value">まだキャプチャされていません</div>
        <div class="captured-actions" id="captured-actions">
            <button class="btn-sub" id="recopy-btn" type="button">COPY AGAIN</button>
            <button class="btn-sub danger" id="clear-btn" type="button">CLEAR</button>
        </div>
    </div>
    <div class="footer">
        <span class="offline-indicator"><span class="offline-dot"></span> OFFLINE READY · NO EXTERNAL SERVICES</span>
        <span>C / Enter = copy · Esc = clear</span>
    </div>
</div>
<textarea id="fallback-textarea" readonly tabindex="-1" aria-hidden="true"></textarea>
<script>
(function () {
    "use strict";
    var MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    var DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var DAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];
    var VALID_FORMATS = { custom: true, custom24: true, long: true, us: true, iso: true, datetime: true, japanese: true, unix: true };
    var STORAGE_KEY = "ltt.format.v2";
    var displayDay = document.getElementById("display-day");
    var displayDate = document.getElementById("display-date");
    var displayTime = document.getElementById("display-time");
    var formatSelect = document.getElementById("format-select");
    var livePreview = document.getElementById("live-preview");
    var copyBtn = document.getElementById("copy-btn");
    var capturedValue = document.getElementById("captured-value");
    var capturedActions = document.getElementById("captured-actions");
    var recopyBtn = document.getElementById("recopy-btn");
    var clearBtn = document.getElementById("clear-btn");
    var statusToast = document.getElementById("status-toast");
    var fallbackTextarea = document.getElementById("fallback-textarea");
    var currentCapturedText = "";
    var toastTimer = null;
    var clockTimer = null;
    var lastSecondKey = "";
    function pad2(number) { return String(number).padStart(2, "0"); }
    function getJSTComponents(date) {
        date = date || new Date();
        var formatter = new Intl.DateTimeFormat("en-US", {
            timeZone: "Asia/Tokyo",
            year: "numeric", month: "numeric", day: "numeric",
            hour: "numeric", minute: "numeric", second: "numeric",
            hourCycle: "h23"
        });
        var parts = formatter.formatToParts(date);
        var map = {};
        var i;
        for (i = 0; i < parts.length; i += 1) {
            if (parts[i].type !== "literal") map[parts[i].type] = parts[i].value;
        }
        var year = parseInt(map.year, 10);
        var monthIndex = parseInt(map.month, 10) - 1;
        var day = parseInt(map.day, 10);
        var hours24 = parseInt(map.hour, 10);
        if (hours24 === 24) hours24 = 0;
        var minutes = parseInt(map.minute, 10);
        var seconds = parseInt(map.second, 10);
        var weekdayIndex = new Date(Date.UTC(year, monthIndex, day)).getUTCDay();
        return {
            year: year, monthIndex: monthIndex, monthNum: pad2(monthIndex + 1),
            dayNum: pad2(day), dayRaw: day, weekdayIndex: weekdayIndex,
            hours24Raw: hours24, hours24: pad2(hours24), hours12: pad2(hours24 % 12 || 12),
            minutes: pad2(minutes), seconds: pad2(seconds),
            ampm: hours24 >= 12 ? "PM" : "AM",
            epochSec: Math.floor(date.getTime() / 1000)
        };
    }
    function formatTimestamp(jst, formatType) {
        switch (formatType) {
        case "custom":
            return jst.dayNum + "-" + MONTHS_SHORT[jst.monthIndex] + "-" + jst.year +
                " \u2014 " + jst.hours12 + ":" + jst.minutes + ":" + jst.seconds + " " + jst.ampm + " (JST, UTC+09:00)";
        case "custom24":
            return jst.dayNum + "-" + MONTHS_SHORT[jst.monthIndex] + "-" + jst.year +
                " \u2014 " + jst.hours24 + ":" + jst.minutes + ":" + jst.seconds + " (JST, UTC+09:00)";
        case "long":
            return jst.dayRaw + " " + MONTHS_LONG[jst.monthIndex] + " " + jst.year +
                " \u2014 " + jst.hours12 + ":" + jst.minutes + ":" + jst.seconds + " " + jst.ampm + " JST";
        case "us":
            return MONTHS_LONG[jst.monthIndex] + " " + jst.dayRaw + ", " + jst.year +
                " \u2014 " + jst.hours12 + ":" + jst.minutes + ":" + jst.seconds + " " + jst.ampm + " (JST)";
        case "iso":
            return jst.year + "-" + jst.monthNum + "-" + jst.dayNum + "T" + jst.hours24 + ":" + jst.minutes + ":" + jst.seconds + "+09:00";
        case "datetime":
            return jst.year + "-" + jst.monthNum + "-" + jst.dayNum + " " + jst.hours24 + ":" + jst.minutes + ":" + jst.seconds + " JST";
        case "japanese":
            return jst.year + "年" + jst.monthNum + "月" + jst.dayNum + "日(" + DAYS_JP[jst.weekdayIndex] + ") " +
                jst.hours24 + "時" + jst.minutes + "分" + jst.seconds + "秒";
        case "unix":
            return String(jst.epochSec);
        default:
            return "";
        }
    }
    function selectedFormat() {
        var value = formatSelect.value;
        return VALID_FORMATS[value] ? value : "custom24";
    }
    function updateClock() {
        var now = new Date();
        var jst = getJSTComponents(now);
        var secondKey = String(jst.year) + jst.monthNum + jst.dayNum + jst.hours24 + jst.minutes + jst.seconds;
        if (secondKey === lastSecondKey) return;
        lastSecondKey = secondKey;
        displayDay.textContent = DAYS_EN[jst.weekdayIndex];
        displayDate.textContent = jst.dayNum + "-" + MONTHS_SHORT[jst.monthIndex] + "-" + jst.year;
        displayTime.textContent = jst.hours24 + ":" + jst.minutes + ":" + jst.seconds;
        livePreview.textContent = formatTimestamp(jst, selectedFormat());
    }
    function scheduleClock() {
        if (clockTimer) clearTimeout(clockTimer);
        var ms = 1000 - new Date().getMilliseconds();
        clockTimer = setTimeout(function () { updateClock(); scheduleClock(); }, ms);
    }
    function copyFallback(text) {
        try {
            fallbackTextarea.value = text;
            fallbackTextarea.focus();
            fallbackTextarea.select();
            fallbackTextarea.setSelectionRange(0, fallbackTextarea.value.length);
            var ok = document.execCommand("copy");
            fallbackTextarea.blur();
            copyBtn.focus();
            return ok;
        } catch (err) { return false; }
    }
    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return copyFallback(text); });
        }
        return Promise.resolve(copyFallback(text));
    }
    function showToast(message) {
        statusToast.textContent = message;
        statusToast.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { statusToast.classList.remove("show"); }, 2200);
    }
    function handleCapture() {
        var timestamp = formatTimestamp(getJSTComponents(new Date()), selectedFormat());
        currentCapturedText = timestamp;
        capturedValue.textContent = timestamp;
        capturedActions.classList.add("is-visible");
        copyToClipboard(timestamp).then(function (copied) {
            if (copied) {
                showToast("COPIED TO CLIPBOARD");
                copyBtn.classList.add("success");
                setTimeout(function () { copyBtn.classList.remove("success"); }, 700);
            } else {
                showToast("CAPTURED — COPY MANUALLY");
            }
        });
    }
    function persistFormat() {
        try { localStorage.setItem(STORAGE_KEY, selectedFormat()); } catch (err) {}
    }
    function restoreFormat() {
        try {
            var saved = localStorage.getItem(STORAGE_KEY);
            formatSelect.value = (saved && VALID_FORMATS[saved]) ? saved : "custom24";
        } catch (err) { formatSelect.value = "custom24"; }
    }
    copyBtn.addEventListener("click", handleCapture);
    recopyBtn.addEventListener("click", function () {
        if (!currentCapturedText) return;
        copyToClipboard(currentCapturedText).then(function (copied) {
            showToast(copied ? "RE-COPIED" : "FAILED TO COPY");
        });
    });
    clearBtn.addEventListener("click", function () {
        currentCapturedText = "";
        capturedValue.textContent = "まだキャプチャされていません";
        capturedActions.classList.remove("is-visible");
        showToast("CLEARED");
    });
    formatSelect.addEventListener("change", function () {
        persistFormat();
        lastSecondKey = "";
        updateClock();
    });
    document.addEventListener("keydown", function (event) {
        var tag = event.target && event.target.tagName;
        var typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
        if (event.key === "Enter" && !event.altKey && !event.metaKey) {
            if (tag !== "SELECT" && tag !== "TEXTAREA") {
                event.preventDefault();
                handleCapture();
            }
        }
        if (!typing && (event.key === "c" || event.key === "C") && !event.ctrlKey && !event.metaKey && !event.altKey) {
            event.preventDefault();
            handleCapture();
        }
        if (event.key === "Escape") clearBtn.click();
    });
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
            lastSecondKey = "";
            updateClock();
            scheduleClock();
        }
    });
    restoreFormat();
    updateClock();
    scheduleClock();
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            navigator.serviceWorker.register("./sw.js").catch(function () {});
        });
    }
}());
</script>
</body>
</html>
