<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Timestamp">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="Live Timestamp Terminal - JST固定のオフライン対応タイムスタンプコピーツール">
    <title>LIVE TIMESTAMP TERMINAL</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --success-color: #4ade80;
            --danger-color: #f87171;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at top, rgba(56, 189, 248, 0.08), transparent 40%), var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35), 0 0 30px rgba(56, 189, 248, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }

        .header h1 {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .header .status {
            margin-top: 0.45rem;
            font-size: 0.65rem;
            color: var(--success-color);
            letter-spacing: 0.08em;
        }

        /* CLOCK */
        .clock-display {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .day-name {
            font-size: 1.15rem;
            color: var(--accent-color);
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .date-str {
            font-family: var(--font-mono);
            font-size: 1.45rem;
            font-weight: bold;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
        }

        .time-str {
            font-family: var(--font-mono);
            font-size: clamp(2.1rem, 9vw, 3rem);
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 0.04em;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.25), 0 0 25px rgba(56, 189, 248, 0.08);
            line-height: 1.1;
            margin-bottom: 0.65rem;
        }

        .timezone-badge {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            background: rgba(51, 65, 85, 0.6);
            color: var(--text-muted);
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* CONTROLS */
        .controls {
            margin-bottom: 1.5rem;
        }

        .format-select-group {
            margin-bottom: 1rem;
        }

        .format-select-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        select {
            width: 100%;
            padding: 0.7rem;
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            font-family: var(--font-mono);
            -webkit-appearance: none;
            appearance: none;
        }

        select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1);
        }

        /* COPY BUTTON */
        .btn-copy {
            width: 100%;
            padding: 0.95rem;
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-copy:hover {
            background: var(--accent-hover);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-copy:active {
            transform: translateY(0);
        }

        .btn-copy.success {
            background: var(--success-color);
            color: #052e16;
        }

        /* CAPTURED SECTION */
        .captured-section {
            background: rgba(15, 23, 42, 0.65);
            border: 1px dashed var(--card-border);
            border-radius: 8px;
            padding: 1rem;
            position: relative;
        }

        .captured-title {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.55rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .status-toast {
            font-size: 0.65rem;
            color: var(--success-color);
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-toast.show {
            opacity: 1;
        }

        .captured-value {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--success-color);
            word-break: break-word;
            line-height: 1.5;
            min-height: 1.4em;
            margin-bottom: 0.75rem;
            -webkit-user-select: text;
            user-select: text;
        }

        .captured-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn-sub {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sub:hover {
            background: rgba(51, 65, 85, 0.9);
        }

        .btn-sub.danger:hover {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            border-color: rgba(239, 68, 68, 0.4);
        }

        /* FOOTER */
        .footer {
            margin-top: 1rem;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: #64748b;
            letter-spacing: 0.04em;
        }

        .offline-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .offline-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success-color);
            box-shadow: 0 0 7px rgba(74, 222, 128, 0.6);
        }

        /* HIDDEN FALLBACK */
        #fallback-textarea {
            position: fixed;
            left: -9999px;
            top: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        /* Install prompt hint */
        .install-hint {
            display: none;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.75rem;
            padding: 0.5rem;
            background: rgba(56, 189, 248, 0.08);
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LIVE TIMESTAMP TERMINAL</h1>
        <div class="status">
            ● REAL-TIME · JST STRICT
        </div>
    </div>

    <!-- CLOCK -->
    <div class="clock-display">
        <div class="day-name" id="display-day">---</div>
        <div class="date-str" id="display-date">---</div>
        <div class="time-str" id="display-time">00:00:00</div>
        <div class="timezone-badge">JST · UTC+09:00</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="format-select-group">
            <label for="format-select">Timestamp Format</label>
            <!-- 選択肢の中身はJSで完全LIVE更新されます -->
            <select id="format-select">
                <option value="custom"></option>
                <option value="custom24"></option>
                <option value="long"></option>
                <option value="us"></option>
                <option value="iso"></option>
                <option value="datetime"></option>
                <option value="japanese"></option>
                <option value="unix"></option>
            </select>
        </div>

        <button class="btn-copy" id="copy-btn">
            <span>📋</span>
            <span>今の時刻をコピー</span>
        </button>
    </div>

    <!-- CAPTURE SECTION -->
    <div class="captured-section">
        <div class="captured-title">
            <span>LAST CAPTURED</span>
            <span class="status-toast" id="status-toast">COPIED!</span>
        </div>
        <div class="captured-value" id="captured-value">まだキャプチャされていません</div>
        <div class="captured-actions" id="captured-actions" style="display: none;">
            <button class="btn-sub" id="recopy-btn">📋 COPY AGAIN</button>
            <button class="btn-sub danger" id="clear-btn">🗑️ CLEAR</button>
        </div>
    </div>

    <div class="footer">
        <span class="offline-indicator">
            <span class="offline-dot"></span>
            OFFLINE READY · NO EXTERNAL SERVICES
        </span>
        <div class="install-hint" id="install-hint">
            ホーム画面に追加してアプリのように使えます
        </div>
    </div>
</div>

<!-- Clipboard fallback -->
<textarea id="fallback-textarea" readonly></textarea>

<script>
    /* =========================================================
       LIVE TIMESTAMP TERMINAL
       Offline / JST Fixed / Clipboard / Live Options / Sync Clock
       PWA Ready
       ========================================================= */

    /* ---------------------------------------------------------
       CONSTANTS
    --------------------------------------------------------- */
    const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const MONTHS_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const DAYS_JP = ["日", "月", "火", "水", "木", "金", "土"];

    /* ---------------------------------------------------------
       DOM
    --------------------------------------------------------- */
    const displayDay = document.getElementById("display-day");
    const displayDate = document.getElementById("display-date");
    const displayTime = document.getElementById("display-time");
    const formatSelect = document.getElementById("format-select");
    const copyBtn = document.getElementById("copy-btn");
    const capturedValue = document.getElementById("captured-value");
    const capturedActions = document.getElementById("captured-actions");
    const recopyBtn = document.getElementById("recopy-btn");
    const clearBtn = document.getElementById("clear-btn");
    const statusToast = document.getElementById("status-toast");
    const fallbackTextarea = document.getElementById("fallback-textarea");
    const installHint = document.getElementById("install-hint");

    let currentCapturedText = "";

    /* ---------------------------------------------------------
       HELPERS
    --------------------------------------------------------- */
    function pad2(number) {
        return String(number).padStart(2, "0");
    }

    /**
     * Intl.DateTimeFormat を使用して、端末のロケール設定に関係なく
     * 厳密な「Asia/Tokyo（JST）」の日時パーツを取得する
     */
    function getJSTComponents(date = new Date()) {
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Tokyo',
            year: 'numeric',
            month: 'numeric',
            day: 'numeric',
            hour: 'numeric',
            minute: 'numeric',
            second: 'numeric',
            weekday: 'short',
            hour12: false
        });

        const parts = formatter.formatToParts(date);
        const map = {};
        for (const p of parts) {
            if (p.type !== 'literal') {
                map[p.type] = p.value;
            }
        }

        const year = parseInt(map.year, 10);
        const monthIndex = parseInt(map.month, 10) - 1;
        const day = parseInt(map.day, 10);
        
        let hours24 = parseInt(map.hour, 10);
        if (hours24 === 24) hours24 = 0; 
        const minutes = parseInt(map.minute, 10);
        const seconds = parseInt(map.second, 10);

        const jstDate = new Date(Date.UTC(year, monthIndex, day, hours24, minutes, seconds));
        const weekdayIndex = jstDate.getUTCDay();

        return {
            year,
            monthIndex,
            monthNum: pad2(monthIndex + 1),
            dayNum: pad2(day),
            dayRaw: day,
            weekdayIndex,
            hours24Raw: hours24,
            hours24: pad2(hours24),
            hours12: pad2(hours24 % 12 || 12),
            minutes: pad2(minutes),
            seconds: pad2(seconds),
            ampm: hours24 >= 12 ? "PM" : "AM",
            epochSec: Math.floor(date.getTime() / 1000) // UTC基準の絶対時間
        };
    }

    /* ---------------------------------------------------------
       TIMESTAMP FORMATTER
    --------------------------------------------------------- */
    function formatTimestamp(jst, formatType) {
        switch (formatType) {
            case "custom":
                return `${jst.dayNum}-${MONTHS_SHORT[jst.monthIndex]}-${jst.year} — ${jst.hours12}:${jst.minutes}:${jst.seconds} ${jst.ampm} (JST, UTC+09:00)`;
            case "custom24":
                return `${jst.dayNum}-${MONTHS_SHORT[jst.monthIndex]}-${jst.year} — ${jst.hours24}:${jst.minutes}:${jst.seconds} (JST, UTC+09:00)`;
            case "long":
                return `${jst.dayRaw} ${MONTHS_LONG[jst.monthIndex]} ${jst.year} — ${jst.hours12}:${jst.minutes}:${jst.seconds} ${jst.ampm} JST`;
            case "us":
                return `${MONTHS_LONG[jst.monthIndex]} ${jst.dayRaw}, ${jst.year} — ${jst.hours12}:${jst.minutes}:${jst.seconds} ${jst.ampm} (JST)`;
            case "iso":
                return `${jst.year}-${jst.monthNum}-${jst.dayNum}T${jst.hours24}:${jst.minutes}:${jst.seconds}+09:00`;
            case "datetime":
                return `${jst.year}-${jst.monthNum}-${jst.dayNum} ${jst.hours24}:${jst.minutes}:${jst.seconds} JST`;
            case "japanese":
                return `${jst.year}年${jst.monthNum}月${jst.dayNum}日(${DAYS_JP[jst.weekdayIndex]}) ${jst.hours24}時${jst.minutes}分${jst.seconds}秒`;
            case "unix":
                return jst.epochSec.toString();
            default:
                return "";
        }
    }

    /* ---------------------------------------------------------
       CLOCK (LIVE UPDATE)
    --------------------------------------------------------- */
    function updateClock() {
        const now = new Date();
        const jst = getJSTComponents(now);

        // 1. メイン時計の更新
        displayDay.textContent = DAYS_EN[jst.weekdayIndex];
        displayDate.textContent = `${jst.dayNum}-${MONTHS_SHORT[jst.monthIndex]}-${jst.year}`;
        displayTime.textContent = `${jst.hours12}:${jst.minutes}:${jst.seconds} ${jst.ampm}`;

        // 2. プルダウン(Timestamp Format)のLIVE更新
        const options = formatSelect.options;
        for (let i = 0; i < options.length; i++) {
            const option = options[i];
            option.textContent = formatTimestamp(jst, option.value);
        }
    }

    /*
       秒境界への同期 (Sync Clock)
       現在時刻のミリ秒を取得し、次の秒(x.000)までの残り時間を計算。
       ジャストのタイミングで updateClock() を呼び出すことで、
       過剰なループを避けつつ、端末らしい正確な描画を実現する。
    */
    function syncClock() {
        const now = new Date();
        const msToNextSecond = 1000 - now.getMilliseconds();
        
        setTimeout(() => {
            updateClock();
            syncClock(); // 次の秒へ再帰スケジュール
        }, msToNextSecond);
    }

    /* ---------------------------------------------------------
       CLIPBOARD
    --------------------------------------------------------- */
    async function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (error) {
                console.warn("Clipboard API failed. Trying fallback.");
            }
        }
        try {
            fallbackTextarea.value = text;
            fallbackTextarea.focus();
            fallbackTextarea.select();
            fallbackTextarea.setSelectionRange(0, fallbackTextarea.value.length);
            const successful = document.execCommand("copy");
            fallbackTextarea.blur();
            if (successful) return true;
        } catch (error) {
            console.error(error);
        }
        return false;
    }

    /* ---------------------------------------------------------
       TOAST & ACTIONS
    --------------------------------------------------------- */
    let toastTimer = null;
    function showToast(message) {
        statusToast.textContent = message;
        statusToast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            statusToast.classList.remove("show");
        }, 2500);
    }

    async function handleCapture() {
        // ボタンを押した瞬間の時刻を厳密に取得
        const jst = getJSTComponents();
        const selectedFormat = formatSelect.value;
        const timestamp = formatTimestamp(jst, selectedFormat);

        currentCapturedText = timestamp;
        capturedValue.textContent = timestamp;
        capturedActions.style.display = "flex";

        const copied = await copyToClipboard(timestamp);

        if (copied) {
            showToast("COPIED TO CLIPBOARD!");
            copyBtn.classList.add("success");
            setTimeout(() => copyBtn.classList.remove("success"), 800);
        } else {
            showToast("CAPTURED — COPY MANUALLY");
        }
    }

    copyBtn.addEventListener("click", handleCapture);

    recopyBtn.addEventListener("click", async () => {
        if (!currentCapturedText) return;
        const copied = await copyToClipboard(currentCapturedText);
        if (copied) {
            showToast("RE-COPIED!");
        } else {
            showToast("FAILED TO COPY");
        }
    });

    clearBtn.addEventListener("click", () => {
        currentCapturedText = "";
        capturedValue.textContent = "まだキャプチャされていません";
        capturedActions.style.display = "none";
        showToast("CLEARED");
    });

    /* ---------------------------------------------------------
       PWA / SERVICE WORKER
    --------------------------------------------------------- */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => {
                    console.log('Service Worker registered:', reg.scope);
                })
                .catch(err => {
                    console.warn('Service Worker registration failed:', err);
                });
        });
    }

    // Show install hint on iOS / standalone check
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (!isStandalone && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        installHint.style.display = 'block';
    }

    /* ---------------------------------------------------------
       INITIALIZE
    --------------------------------------------------------- */
    // 初回描画
    updateClock();
    // 秒境界に合わせて同期ループ開始
    syncClock();
</script>
</body>
</html>
