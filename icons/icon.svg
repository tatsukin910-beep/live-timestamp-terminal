<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="12"/>
  <!-- Inner clock face -->
  <circle cx="256" cy="256" r="150" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
  <!-- Hour marks -->
  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="120" x2="256" y2="140"/>
    <line x1="256" y1="372" x2="256" y2="392"/>
    <line x1="120" y1="256" x2="140" y2="256"/>
    <line x1="372" y1="256" x2="392" y2="256"/>
    <line x1="160" y1="160" x2="174" y2="174"/>
    <line x1="338" y1="338" x2="352" y2="352"/>
    <line x1="352" y1="160" x2="338" y2="174"/>
    <line x1="174" y1="338" x2="160" y2="352"/>
  </g>
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="340" y2="256" stroke="#4ade80" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="16" fill="#38bdf8"/>
  <!-- Terminal accent bar -->
  <rect x="180" y="420" width="152" height="12" rx="6" fill="url(#accent)"/>
</svg>
